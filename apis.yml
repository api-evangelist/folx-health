aid: folx-health
name: Folx Health
description: 'FOLX Health is a virtual healthcare platform built for and by the LGBTQIA+
  community, delivering clinician-led care through a predominantly queer and trans network
  of providers. Its consumer services span gender-affirming hormone therapy (HRT), PrEP
  and sexual & reproductive health, primary care, mental health and therapy, and fertility
  and family building, plus care navigation, a peer community platform, and secure
  provider messaging. Members access care through the web and iOS/Android apps with
  same or next-day appointments and insurance acceptance. FOLX is a direct-to-consumer
  digital health company and, as of this profile, does not publish a public developer
  API, developer portal, or OpenAPI specification. This entry was surfaced as a portfolio
  company of Bessemer Venture Partners and enriched from its public web presence.'
